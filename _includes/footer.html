<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div class="footer-about">
        <h3><i class="fas fa-chart-line"></i> {{ site.title }}</h3>
        <p>{{ site.description }}</p>
      </div>
      <div class="footer-links">
        <h4>Quick Links</h4>
        <ul>
          <li><a href="{{ '/' | relative_url }}">Home</a></li>
          <li><a href="{{ '/blog/' | relative_url }}">Blog</a></li>
          <li><a href="{{ '/portfolio/' | relative_url }}">Portfolio</a></li>
          <li><a href="{{ '/about/' | relative_url }}">About</a></li>
        </ul>
      </div>
      <div class="footer-categories">
        <h4>Categories</h4>
        <ul>
          <li><a href="{{ '/blog/' | relative_url }}">SQL Tuning</a></li>
          <li><a href="{{ '/blog/' | relative_url }}">Python Analysis</a></li>
          <li><a href="{{ '/blog/' | relative_url }}">Performance</a></li>
          <li><a href="{{ '/blog/' | relative_url }}">Data Engineering</a></li>
        </ul>
      </div>
      <div class="footer-social">
        <h4>Connect</h4>
        <div class="social-icons">
          <a href="https://github.com/{{ site.author.github }}" target="_blank" aria-label="GitHub">
            <i class="fab fa-github"></i>
          </a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; {{ 'now' | date: '%Y' }} {{ site.author.name }}. Built with Jekyll & GitHub Pages.</p>
    </div>
  </div>
</footer>
